name: Build Engbers Projektzentrale 1.4.39
on:
  push:
    paths:
      - 'build/1439/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1439/patch_1439.py
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('build/1439/patch_1439.py')
          spec=importlib.util.spec_from_file_location('p1439',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''APP_VERSION = "1.4.38"\ndef host():\n    top=object()\n    result_tree=object()\n    def _pz_1438_activate_project(_target):\n        return True\n    def _pz_1438_open_project(_evt=None):\n        try:\n            _vals=('Projekt','25-027 · Klee')\n            if _pz_1438_activate_project(str(_vals[1]).strip()):\n                try:top.after(70,top.destroy)\n                except Exception:pass\n                return 'break'\n        except Exception:\n            return\n    def _pz_1438_bind_project_open():\n        pass\n'''
          out,ok=m._patch_search_order(src)
          assert ok
          assert 'PZ_SEARCH_ORDER_V1439' in out
          assert 'top.destroy()' in out
          assert 'after(120,_pz_1439_switch_after_close)' in out
          compile(out,'synthetic_1439.py','exec')
          print('synthetic 1.4.39 test OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1439/patch_1439.py'
          starter=root/'build/1439/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_39_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1439.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.39','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_39_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.39','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.38','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_39_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.39: Korrektur der Projektnavigation aus der globalen Suche. Das Suchfenster wird beim Doppelklick zuerst vollständig geschlossen; erst danach wird der Projektwechsel im Hauptfenster ausgelöst. Dadurch kann ein modales Suchfenster den Wechsel nicht mehr blockieren oder anschließend überschreiben.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_39_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_39_TINY.zip stable/update_1_4_39_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.39'
          git pull --rebase origin main
          git push origin main
