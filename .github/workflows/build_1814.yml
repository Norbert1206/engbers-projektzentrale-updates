name: Build Engbers Projektzentrale 1.8.14
on:
  push:
    paths:
      - 'build/1814/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and patch stable 1.8.13
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1814
          mkdir -p /tmp/pz1814/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_13_TINY.zip?rev=1813-professional-billing-texts' -o /tmp/pz1814/base.zip
          unzip -q /tmp/pz1814/base.zip -d /tmp/pz1814/unpacked
          cp build/1814/correspondence_v1814.py /tmp/pz1814/unpacked/correspondence_v1814.py
          cp build/1814/contacts_v1814.py /tmp/pz1814/unpacked/contacts_v1814.py
          cp build/1814/letter_template_v1814.py /tmp/pz1814/unpacked/letter_template_v1814.py
          python build/1814/enhance_correspondence_1814.py /tmp/pz1814/unpacked
          python build/1814/patch_1814.py /tmp/pz1814/unpacked
      - name: Build update package and manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.')
          src=pathlib.Path('/tmp/pz1814/unpacked')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_14_TINY.zip'
          if zip_path.exists(): zip_path.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ('app.py','commercial_v1890.py','post_update.py','correspondence_v1814.py','contacts_v1814.py','letter_template_v1814.py'):
                  assert req in names, req
              assert 'anschreiben_template.docx' not in names
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.14','published_at':'2026-09-17',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_14_TINY.zip?rev=1814-private-letter-addressbook',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.14: Unter Kommunikation kommen ANSCHREIBEN ERSTELLEN und ADRESSBUCH hinzu. Das lokale Adressbuch speichert Firmen und Ansprechpartner mit Anschrift, Telefon, Mobil, E-Mail, Webseite, Quelle und Notiz; eine Dublettenpruefung ist vorbereitet. Beim Anschreiben kann der Empfaenger direkt aus dem Adressbuch uebernommen werden. Das vorhandene Engbers-Musteranschreiben wird beim ersten Einsatz einmal lokal ausgewaehlt und automatisch als private Arbeitsvorlage eingerichtet; der persoenliche Briefkopf und darin enthaltene Bueroangaben werden nicht im Update oder GitHub gespeichert. Das Word-Anschreiben wird projektbezogen unter 08_Kommunikation/Anschreiben gespeichert und in der Kommunikationsakte registriert. Die Adressstruktur ist fuer spaetere mobile Synchronisation vorbereitet. Alle Funktionen aus Version 1.8.13 bleiben erhalten.',
            'update_available':True}
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_14_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.14 private correspondence and address book'
          git pull --rebase origin main
          git push origin main
