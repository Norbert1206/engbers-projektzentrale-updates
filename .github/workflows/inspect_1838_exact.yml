name: Inspect IDEA exact anchors
on:
  push:
    paths:
      - 'build/1838/INSPECT2'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact anchors
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1838x
          mkdir -p /tmp/pz1838x/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_37_TINY.zip?rev=1837-outlook-foreground' -o /tmp/pz1838x/base.zip
          unzip -q /tmp/pz1838x/base.zip -d /tmp/pz1838x/src
          A=/tmp/pz1838x/src/app.py
          echo '--- 350-470 ---'; sed -n '350,470p' "$A"
          echo '--- 920-990 ---'; sed -n '920,990p' "$A"
          echo '--- 1650-1740 ---'; sed -n '1650,1740p' "$A"
          echo '--- 4230-4290 ---'; sed -n '4230,4290p' "$A"
          echo '--- root helpers ---'; grep -nE '^    def .*project|project_root|folder_for|current_project|project_folder' "$A" | head -n 160
