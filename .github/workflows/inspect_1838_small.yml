name: Inspect IDEA small anchors
on:
  push:
    paths:
      - 'build/1838/INSPECT3'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Small anchors
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1838s
          mkdir -p /tmp/pz1838s/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_37_TINY.zip?rev=1837-outlook-foreground' -o /tmp/pz1838s/base.zip
          unzip -q /tmp/pz1838s/base.zip -d /tmp/pz1838s/src
          A=/tmp/pz1838s/src/app.py
          echo '--- new project ---'; sed -n '422,465p' "$A"
          echo '--- root getter ---'; sed -n '560,585p' "$A"
          echo '--- starter ---'; sed -n '900,990p' "$A"
