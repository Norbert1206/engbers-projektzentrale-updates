name: Build Engbers Projektzentrale 1.4.41
on:
  push:
    paths:
      - 'build/1441/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1441/patch_1441.py
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('build/1441/patch_1441.py')
          spec=importlib.util.spec_from_file_location('p1441',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''APP_VERSION = "1.4.40"\nclass Demo:\n    def global_search(self):\n        top=object()\n        result_tree=object()\n        def _pz_1438_open_project(_evt=None):\n            try:\n                _iid=result_tree.identify_row(_evt.y)\n            except Exception:\n                _iid=''\n            try:top.destroy()\n            except Exception:pass\n        def _pz_1438_bind_project_open():\n            pass\n'''
          out,ok=m._patch_search_direct(src)
          assert ok
          assert 'PZ_SEARCH_DIRECT_V1441' in out
          assert 'self.project_id=_pid' in out
          assert 'self.project_var.set(_label)' in out
          assert "self.nav_buttons[_active_label].invoke()" in out
          assert 'winfo_children' not in out[out.find('def _pz_1438_open_project'):out.find('def _pz_1438_bind_project_open')]
          compile(out,'synthetic_1441.py','exec')
          print('synthetic 1.4.41 test OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1441/patch_1441.py'
          starter=root/'build/1441/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_41_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1441.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.41','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_41_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.41','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.38','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_41_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.41: Die globale Projektsuche wechselt Projekte jetzt direkt über die interne Projektverwaltung der Projektzentrale (project_map/project_id) statt den Projektwähler in der Oberfläche zu suchen. Der aktuelle Fachbereich, z. B. Statik, bleibt beim Projektwechsel nach Möglichkeit erhalten.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_41_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_41_TINY.zip stable/update_1_4_41_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.41'
          git pull --rebase origin main
          git push origin main
