name: Inspect legacy search implementation
on:
  push:
    paths:
      - 'build/inspect_search_131/BUILD'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and inspect legacy app
        shell: bash
        run: |
          set +e
          rm -rf /tmp/legacy132
          git worktree add /tmp/legacy132 origin/release-1.3.2
          cd /tmp/legacy132
          python - <<'PY'
          import pathlib, zipfile, ast, base64, io
          p=pathlib.Path('stable/Engbers_Projektzentrale_UPDATE_1_3_2_MIN.zip')
          print('FILE_SIZE',p.stat().st_size if p.exists() else -1)
          try:
              raw=base64.b64decode(p.read_bytes(),validate=False)
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  print('ZIP_NAMES',z.namelist())
                  candidates=[n for n in z.namelist() if n.lower().endswith('app.py')]
                  if not candidates:
                      print('NO_APP_PY'); raise SystemExit(0)
                  src=z.read(candidates[0]).decode('utf-8')
          except Exception as e:
              print('INSPECT_ERROR',repr(e)); raise SystemExit(0)
          print('APP_LEN',len(src))
          tree=ast.parse(src)
          for node in ast.walk(tree):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  seg=ast.get_source_segment(src,node) or ''
                  low=seg.casefold()
                  if 'suchergebnisse' in low or ('combobox' in low and ('project' in low or 'projekt' in low)):
                      print('\n===== FUNCTION',node.name,'lines',node.lineno,getattr(node,'end_lineno',None),'=====')
                      print(seg[:30000])
          print('\n===== PROJECT/SEARCH LINES =====')
          for i,line in enumerate(src.splitlines(),1):
              low=line.casefold()
              if any(x in low for x in ('combobox','suchergebnisse','project_var','projekt_var','current_project','selected_project','projekt gewählt','projekt gewechselt','load_project','select_project')):
                  print(f'{i}: {line}')
          PY
          exit 0
