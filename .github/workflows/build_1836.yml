name: Build Engbers Projektzentrale 1.8.36
on:
  push:
    paths:
      - 'build/1836/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.35
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1836build
          mkdir -p /tmp/pz1836build/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_35_TINY.zip?rev=1835b-hidrive-share-pid' -o /tmp/pz1836build/base.zip
          unzip -q /tmp/pz1836build/base.zip -d /tmp/pz1836build/unpacked
          python build/1836/patch_1836.py /tmp/pz1836build/unpacked
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pz1836build/unpacked/share_basket_v1821.py').read_text(encoding='utf-8')
          for marker in ('last_share_link','_current_share_link','HiDrive-Freigabelink wurde automatisch','my.hidrive.com/share/'):
              assert marker in p, marker
          print('OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1836build/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_36_TINY.zip'
          if zp.exists(): zp.unlink()
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc':
                      z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          m={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.36','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_36_TINY.zip?rev=1836-outlook-hidrive-link',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.36: HiDrive-Freigabelink wird automatisch in OUTLOOK-MAIL übernommen. Nach erfolgreichem HIDRIVE-LINK merkt sich der Freigabekorb den Link; zusätzlich wird ein passender HiDrive-Link aus der Zwischenablage erkannt. Der Outlook-Entwurf enthält den Link direkt im Begleittext. Alle Funktionen aus 1.8.35 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_36_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.36 Outlook HiDrive link'
          git pull --rebase origin main
          git push origin main
