name: Inspect Statiktools Package
'on':
  push:
    paths:
      - 'statiktools/inspect.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1.21.0
        shell: python
        run: |
          import base64, io, json, zipfile, hashlib, pathlib, re
          root=pathlib.Path("statiktools/stable")
          src=json.loads((root/"package_1_20_30.json").read_text(encoding="utf-8"))
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(src["data_base64"])))
          files={n:z.read(n) for n in z.namelist()}
          html=files["index.html"].decode("utf-8")
          html=re.sub(r'<script[^>]+src=["\']js/output_test\.js[^"\']*["\'][^>]*></script>','',html,flags=re.I)
          html=re.sub(r'<script[^>]+src=["\']js/output_document\.js[^"\']*["\'][^>]*></script>','',html,flags=re.I)
          html=re.sub(r'<script id="engbers-output-inline">.*?</script>','',html,flags=re.I|re.S)
          tag='<script src="js/output_document.js?v=12100"></script>'
          html=re.sub(r'</body\s*>',tag+'\n</body>',html,count=1,flags=re.I) if re.search(r'</body\s*>',html,re.I) else html+'\n'+tag
          files["index.html"]=html.encode("utf-8")
          files["js/output_document.js"]=Path("statiktools/source/output_document.js").read_bytes()

          doc=files["js/output_document.js"].decode("utf-8")
          doc=re.sub(r'const VERSION="[^"]+";', 'const VERSION="1.21.0";', doc)
          # Fix project extraction: exact label matching only; never reuse "Bussmann" for unrelated fields.
          doc=doc.replace('.includes(label.toLowerCase())', '===label.toLowerCase()')
          doc=doc.replace('site:field("Baustellenanschrift")||field("Straße / Nr.")||"",', 'site:field("Baustellenanschrift")||field("Straße / Nr.")||"",')
          # Rebuild output around the calculation document instead of KPI dashboard cards.
          doc=doc.replace('grid-template-columns:repeat(3,1fr)', 'grid-template-columns:repeat(2,1fr)')
          doc=doc.replace('font-size:16pt;margin-top:2mm', 'font-size:13pt;margin-top:1.5mm')
          # keep all technical graphics SVG/vector; A4 is fixed in mm and printing is isolated from app UI
          doc=doc.replace('@page{size:A4_margin:0}', '@page{size:A4 portrait;margin:0}')
          doc=doc.replace('min-height:297mm', 'height:297mm;min-height:297mm')
          files["js/output_document.js"]=doc.encode("utf-8")
          files.pop("js/output_test.js",None)
          files["VERSION.txt"]=bytes([49,46,50,49,46,48,10])
          out=io.BytesIO()
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as q:
              for n,b in files.items(): q.writestr(n,b)
          raw=out.getvalue(); sha=hashlib.sha256(raw).hexdigest()
          pkg={"format":"base64-json","version":"1.21.0","sha256":sha,"data_base64":base64.b64encode(raw).decode()}
          (root/"package_1_21_1.json").write_text(json.dumps(pkg,separators=(",",":")),encoding="utf-8")
          manifest={"version":"1.21.0","update_available":True,
            "notes":"1.21.0: Großes Ausgabe-Update: Ausgabedokument direkt an die vorhandene Ausgabeansicht gekoppelt: echte Projektdaten, aktuelle Ergebnis-Tabellen und vorhandene SVG-Fachgrafiken werden unverändert übernommen. Rechenkern unverändert.",
            "package_url":"https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/statiktools/stable/package_1_21_1.json?v=202610071625",
            "package_format":"base64-json","sha256":sha}
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          # self-check package structure
          assert files["VERSION.txt"].strip()==b"1.21.0"
          assert b"output_document.js?v=12100" in files["index.html"]
          assert b"rw-output-sheet" in files["js/output_document.js"]
          assert b"Engbers.rwCalc" not in files["js/output_document.js"]
          assert b'const VERSION="1.21.0"' in files["js/output_document.js"]
      - name: Commit update
        run: |
          git config user.name "Engbers Update Builder"
          git config user.email "actions@users.noreply.github.com"
          git add statiktools/stable/package_1_21_1.json statiktools/stable/manifest.json
          git commit -m "Statiktools 1.21.0 consolidated output update" || exit 0
          git push
