name: Inspect share basket symbols
on:
  push:
    paths:
      - 'build/1840b/INSPECT2'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect symbols
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1840s
          mkdir -p /tmp/pz1840s/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_39_TINY.zip?rev=1839-real-idea-structure' -o /tmp/pz1840s/base.zip
          unzip -q /tmp/pz1840s/base.zip -d /tmp/pz1840s/src
          echo '--- app imports/calls ---'
          grep -nE 'share_basket_v1821|add_items\(|open_share|show_share|ShareBasket|Freigabekorb' /tmp/pz1840s/src/app.py | head -n 100 || true
          echo '--- module defs ---'
          grep -nE '^def |^class ' /tmp/pz1840s/src/share_basket_v1821.py | head -n 120
