name: Build Engbers Projektzentrale 1.8.34b
on:
  push:
    paths:
      - 'build/1834/BUILD2'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.33
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1834b
          mkdir -p /tmp/pz1834b/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_33_TINY.zip?rev=1833-hidrive-default-redirect' -o /tmp/pz1834b/base.zip
          unzip -q /tmp/pz1834b/base.zip -d /tmp/pz1834b/unpacked
          cp build/1834/hidrive_sharelink_v1834.py /tmp/pz1834b/unpacked/hidrive_sharelink_v1834.py
          python build/1834/patch_1834b.py /tmp/pz1834b/unpacked
      - name: Verify HiDrive link flow
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/pz1834b/unpacked')
          b=(root/'share_basket_v1821.py').read_text(encoding='utf-8')
          h=(root/'hidrive_sharelink_v1834.py').read_text(encoding='utf-8')
          assert 'HIDRIVE-LINK' in b
          assert 'last_share_link' in b
          assert 'create_share_link_for_local_dir' in h
          assert '"/share"' in h
          print('OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1834b/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_34_TINY.zip'
          if zp.exists(): zp.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.34','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_34_TINY.zip?rev=1834b-hidrive-share-link',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.34: HiDrive-Freigabelink direkt aus dem Freigabekorb. HIDRIVE-LINK erstellt den Freigabeordner, wartet auf die HiDrive-Synchronisation, erzeugt ueber die HiDrive-API eine schreibgeschuetzte Ordnerfreigabe und kopiert den Link in die Zwischenablage. Der zuletzt erzeugte Link wird bei OUTLOOK-MAIL automatisch in den Mailtext eingefuegt. Alle Funktionen aus 1.8.33 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_34_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.34 HiDrive share link'
          git pull --rebase origin main
          git push origin main
