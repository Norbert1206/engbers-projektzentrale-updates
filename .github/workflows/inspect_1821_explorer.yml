name: Inspect 1.8.20 project explorer
on:
  push:
    paths:
      - 'build/1821/INSPECT_EXPLORER'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print project explorer source
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1821
          mkdir -p /tmp/pz1821
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_20_TINY.zip?rev=1820-hidrive-share' -o /tmp/pz1821/base.zip
          unzip -q /tmp/pz1821/base.zip -d /tmp/pz1821/src
          sed -n '1020,1375p' /tmp/pz1821/src/app.py
