name: Build Engbers Projektzentrale 1.8.35b
on:
  push:
    paths:
      - 'build/1835/BUILD2'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.34
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1835b
          mkdir -p /tmp/pz1835b/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_34_TINY.zip?rev=1834c-hidrive-share-link' -o /tmp/pz1835b/base.zip
          unzip -q /tmp/pz1835b/base.zip -d /tmp/pz1835b/unpacked
          cp build/1835/hidrive_sharelink_v1835.py /tmp/pz1835b/unpacked/hidrive_sharelink_v1834.py
          python build/1835/patch_1835b.py /tmp/pz1835b/unpacked
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('/tmp/pz1835b/unpacked')
          s=(r/'hidrive_sharelink_v1834.py').read_text(encoding='utf-8')
          assert '_api_post("/share", token, {"pid": dir_id})' in s
          assert '"writable": "false"' not in s
          assert 'def _http_detail' in s
          print('OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1835b/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_35_TINY.zip'
          if zp.exists(): zp.unlink()
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc':
                      z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          m={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.35','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_35_TINY.zip?rev=1835b-hidrive-share-pid',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.35: HiDrive-Link-Erzeugung korrigiert. Der synchronisierte Zielordner wird zuerst per API aufgeloest und die Freigabe danach mit seiner eindeutigen Verzeichnis-ID (pid) erzeugt. Der Request nutzt nur die zwingend benoetigte Angabe; die Freigabe bleibt gemaess HiDrive-Standard read-only. API-Fehler zeigen nun den vollstaendigen Serverhinweis. Alle Funktionen aus 1.8.34 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_35_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.35 HiDrive share PID fix'
          git pull --rebase origin main
          git push origin main
