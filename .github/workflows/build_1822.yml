name: Build Engbers Projektzentrale 1.8.22
on:
  push:
    paths:
      - 'build/1822/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download stable 1.8.21 and patch
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1822
          mkdir -p /tmp/pz1822/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_21_TINY.zip?rev=1821-share-basket' -o /tmp/pz1822/base.zip
          unzip -q /tmp/pz1822/base.zip -d /tmp/pz1822/unpacked
          cp build/1822/outlook_v1822.py /tmp/pz1822/unpacked/outlook_v1822.py
          python build/1822/patch_1822.py /tmp/pz1822/unpacked
      - name: Smoke test Outlook helper without Outlook
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          src=pathlib.Path('/tmp/pz1822/unpacked/outlook_v1822.py')
          spec=importlib.util.spec_from_file_location('outlook_v1822',src)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          html=m._html_body('Hallo\nTest & <ok>')
          assert 'Hallo<br>Test &amp; &lt;ok&gt;' in html
          try:
              m.open_outlook_draft('x@example.com','Test','Hallo')
          except RuntimeError as exc:
              assert 'Windows' in str(exc)
          print('Outlook helper smoke test OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1822/unpacked')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_22_TINY.zip'
          if zip_path.exists(): zip_path.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ('app.py','post_update.py','share_basket_v1821.py','outlook_v1822.py'):
                  assert req in names,req
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.22','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_22_TINY.zip?rev=1822-outlook-draft',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.22: Outlook (klassisch) direkt aus dem Freigabekorb. Empfänger wird aus dem lokalen Adressbuch gewählt; Betreff und Begleittext sind vorbefüllt und editierbar. Optional können die Dateien aus dem Freigabekorb direkt angehängt werden; bei großen Anhängen erscheint eine Warnung. Es wird ausschließlich ein sichtbarer Outlook-Entwurf geöffnet – niemals automatisch versendet. Die vorhandene Outlook-Signatur bleibt erhalten. Alle Funktionen aus 1.8.21 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_22_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.22 Outlook draft'
          git pull --rebase origin main
          git push origin main
