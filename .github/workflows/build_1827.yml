name: Build Engbers Projektzentrale 1.8.27
on:
  push:
    paths:
      - 'build/1827/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.26
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1827build
          mkdir -p /tmp/pz1827build/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_26_TINY.zip?rev=1826-outlook-folder-fallback' -o /tmp/pz1827build/base.zip
          unzip -q /tmp/pz1827build/base.zip -d /tmp/pz1827build/unpacked
          python build/1827/patch_1827.py /tmp/pz1827build/unpacked
      - name: Verify recursive Outlook reader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pz1827build/unpacked/outlook_archive_v1823.py').read_text(encoding='utf-8')
          for marker in ('def _scan_script_v1827','Walk-Folders','Add-RealFolder','_scan_script_v1827(),'):
              assert marker in p, marker
          print('OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          src=pathlib.Path('/tmp/pz1827build/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_27_TINY.zip'
          if zp.exists(): zp.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.27','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_27_TINY.zip?rev=1827-outlook-recursive-reader',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.27: Outlook-Leser grundlegend robuster. Neben den Standardordnern wird jetzt die reale Outlook-Ordnerstruktur rekursiv durchsucht und Posteingang sowie Gesendet-Ordner anhand ihrer echten Namen erkannt. Dadurch werden auch IMAP- und Mehrkonten-Konfigurationen erfasst, bei denen die bisherige Standardordner-Abfrage leer blieb. Doppelte Mails werden per Outlook EntryID unterdrückt. Alle Funktionen aus 1.8.26 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_27_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.27 Outlook recursive reader'
          git pull --rebase origin main
          git push origin main
