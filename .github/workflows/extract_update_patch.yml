name: Extract update patch for inspection
on:
  push:
    paths:
      - 'tools/extract_request.txt'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract 1.4.11 patch
        run: |
          python - <<'PY'
          import json, base64, zipfile, io, pathlib
          j=json.loads(pathlib.Path('stable/update_1_4_11_tiny.json').read_text())
          data=base64.b64decode(j['payload_b64'])
          z=zipfile.ZipFile(io.BytesIO(data))
          out=pathlib.Path('debug')
          out.mkdir(exist_ok=True)
          for name in z.namelist():
              if name.endswith('.py') or name.endswith('.cmd'):
                  (out/pathlib.Path(name).name).write_bytes(z.read(name))
          PY
      - name: Commit extracted sources
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add debug/
          git diff --cached --quiet && exit 0
          git commit -m 'Extract 1.4.11 patch sources for inspection'
          git push
