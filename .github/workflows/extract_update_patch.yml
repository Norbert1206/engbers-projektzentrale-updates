name: Extract update patch for inspection
on:
  push:
    paths:
      - 'tools/extract_request.txt'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract update patches
        run: |
          python - <<'PY'
          import json, base64, zipfile, io, pathlib
          out=pathlib.Path('debug'); out.mkdir(exist_ok=True)
          for rel in ['stable/update_1_4_7_tiny.json','stable/update_1_4_8_tiny.json','stable/update_1_4_11_tiny.json']:
              j=json.loads(pathlib.Path(rel).read_text())
              z=zipfile.ZipFile(io.BytesIO(base64.b64decode(j['payload_b64'])))
              for name in z.namelist():
                  if name.endswith('.py') or name.endswith('.cmd'):
                      (out/pathlib.Path(name).name).write_bytes(z.read(name))
          PY
      - name: Commit extracted sources
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add debug/
          git diff --cached --quiet && exit 0
          git commit -m 'Extract update patch sources for inspection'
          git push
