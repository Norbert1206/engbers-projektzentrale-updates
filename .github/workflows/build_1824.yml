name: Build Engbers Projektzentrale 1.8.24
on:
  push:
    paths:
      - 'build/1824/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.23
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1824
          mkdir -p /tmp/pz1824/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_23_TINY.zip?rev=1823-outlook-project-archive' -o /tmp/pz1824/base.zip
          unzip -q /tmp/pz1824/base.zip -d /tmp/pz1824/unpacked
          python build/1824/patch_1824.py /tmp/pz1824/unpacked
      - name: Smoke test null-safe stdout and JSON
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          src=pathlib.Path('/tmp/pz1824/unpacked/outlook_archive_v1823.py')
          spec=importlib.util.spec_from_file_location('m',src)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          class R:
              returncode=0; stdout=None; stderr=None
          old=m.subprocess.run
          oldos=m.os.name
          try:
              m.os.name='nt'
              m.subprocess.run=lambda *a,**k:R()
              assert m._powershell('x')==''
          finally:
              m.subprocess.run=old
              m.os.name=oldos
          print('null stdout guard OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1824/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_24_TINY.zip'
          if zp.exists(): zp.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z:
              assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.24','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_24_TINY.zip?rev=1824-outlook-sync-hotfix',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.24: Hotfix für Outlook-Synchronisierung. Leere/fehlende PowerShell-Ausgaben werden jetzt robust behandelt; die Synchronisierung bricht nicht mehr mit NoneType/strip ab. Zusätzlich werden leere JSON-Antworten sauber als keine Treffer behandelt. Alle Funktionen aus 1.8.23 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_24_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.24 Outlook sync hotfix'
          git pull --rebase origin main
          git push origin main
