name: Inspect 1.8.27 communication hooks
on:
  push:
    paths:
      - 'build/1828/INSPECT'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stable 1.8.27 communication source
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1828
          mkdir -p /tmp/pz1828/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_27_TINY.zip?rev=1827-outlook-recursive-reader' -o /tmp/pz1828/base.zip
          unzip -q /tmp/pz1828/base.zip -d /tmp/pz1828/src
          sed -n '4260,4355p' /tmp/pz1828/src/app.py
          sed -n '1,360p' /tmp/pz1828/src/outlook_archive_v1823.py
