name: Inspect 1.8.31 HiDrive integration
on:
  push:
    paths:
      - 'build/1832/INSPECT'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stable HiDrive hooks
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1832
          mkdir -p /tmp/pz1832/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_31_TINY.zip?rev=1831-outlook-assignment-search' -o /tmp/pz1832/base.zip
          unzip -q /tmp/pz1832/base.zip -d /tmp/pz1832/src
          echo '=== HiDrive refs ==='
          grep -Rni -C 8 --include='*.py' 'HiDrive\|STRATO-FREIGABE\|Projektfreigaben\|share' /tmp/pz1832/src | head -n 1200 || true
          echo '=== share basket ==='
          sed -n '1,420p' /tmp/pz1832/src/share_basket_v1821.py
