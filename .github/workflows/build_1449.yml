name: Build Engbers Projektzentrale 1.4.49
on:
  push:
    paths:
      - 'build/1449/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch
        run: |
          python -m py_compile build/1449/patch_1449.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('build/1449/patch_1449.py')
          spec=importlib.util.spec_from_file_location('p1449',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''APP_VERSION = "1.4.48"\nclass Demo:\n    def show_statik_pdf(self):\n        pass\n    def show_statics(self):\n        def _position_layout_1445():\n            pass\n        # 1.4.35: Bearbeitungsstatus kompakt direkt hinter der Positionsspalte.\n        def position_selected(*a):\n            pass\n        ptr.bind('<<TreeviewSelect>>',position_selected)\n        if mb_projects:\n            def select_mb_project(_evt=None):\n                sel=tr.selection()\n                if not sel:return\n                iid=sel[0]; target=item_paths.get(iid)\n                if item_names.get(iid)=='ALLE mb-PROJEKTE': load_all_positions()\n                elif target: load_positions(target,item_names.get(iid,target.name))\n            first=tr.get_children()\n            if first:\n                tr.selection_set(first[0]); tr.focus(first[0]); load_all_positions()\n    def show_project_explorer(self):\n        def selected(): return None,None,None\n        def _load_folder(iid,pp,root): pass\n        def show_in_windows_explorer(): pass\n        categories=('Baugrund / Bodengutachten','Statik','Prüfstatik','Pläne / CAD','Wärmeschutz','Schallschutz','DGNB/QNG','Bauleitung','Kommunikation','Bescheinigungen','Dokumente','Fotos / Bilder','Sonstiges')\n        menu=tk.Menu(self,tearoff=0); menu.add_command(label='Fachlich zuordnen…',command=assign); menu.add_command(label='Original öffnen',command=open_original); menu.add_command(label='Im Windows-Explorer zeigen',command=show_in_windows_explorer)\n        tr.bind('<<TreeviewOpen>>',on_open); tr.bind('<Double-1>',on_double); tr.bind('<Return>',on_double); tr.bind('<<TreeviewSelect>>',refresh)\n    def global_search(self):\n        def open_search_hit():\n                active=None\n                for label,button in self.nav_buttons.items():\n                    try:\n                        if str(button.cget('bg')).lower()==str(DARK2).lower():\n                            active=label\n                            break\n                    except Exception:\n                        pass\n\n                self.project_id=pid\n                def finish_switch():\n                    if active and active in self.nav_buttons:\n                        pass\n'''
          out=m.transform(src)
          compile(out,'fixture_1449.py','exec')
          markers=('PZ_STATIK_PDF_TREE_V1449','PZ_PROJECT_EXPLORER_CONTEXT_V1449','PZ_POSITION_LAYOUT_V1449','PZ_POSITION_CONTEXT_V1449','PZ_REMEMBER_MB_PROJECT_V1449','PZ_SEARCH_KEEP_VIEW_V1449')
          for marker in markers: assert marker in out, marker
          assert "APP_VERSION = \"1.4.48\"" in out
          print('1.4.49 synthetic validation OK')
          PY
      - name: Build update package
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,base64,json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_49_TINY.zip'
          payload=[('build/1449/patch_1449.py','patch_1449.py'),('build/1449/START_PROJEKTZENTRALE.cmd','START_PROJEKTZENTRALE.cmd')]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:z.write(root/src,dst)
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.49','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_49_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.49','published_at':'2026-09-16','min_bootstrap_version':'1.4.48',
              'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_49_tiny.json','package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.49: Statik PDF zeigt die echte Ordnerstruktur wie ein kleiner Explorer, mit Suche, Auf-/Zuklappen, Doppelklick, Windows-Explorer und Pfadkopie. Der Projekt-Explorer erhält Pfadkopie, Auf-/Zuklappen und F5. Die Positionsakte wird in Gesamt- und Einzelansicht ohne horizontales Scrollen kompakter, bekommt ein Rechtsklick-Menü für häufige Positionsaktionen, merkt das zuletzt gewählte mb-Projekt und die globale Projektsuche hält die Statik-PDF-Ansicht beim Projektwechsel.',
              'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          raw=base64.b64decode(json.loads((root/'stable/update_1_4_49_tiny.json').read_text(encoding='utf-8'))['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_49_TINY.zip stable/update_1_4_49_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.49'
          git pull --rebase origin main
          git push origin main
