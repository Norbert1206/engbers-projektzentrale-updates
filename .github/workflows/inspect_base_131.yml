name: Inspect base app search and navigation
on:
  push:
    paths:
      - 'tools/INSPECT_BASE'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract focused snippets without failing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io, json, os, pathlib, urllib.request, zipfile, base64
          root=pathlib.Path('.')
          outpath=root/'debug/base132_search_nav_snippets.txt'
          try:
              url='https://api.github.com/repos/Norbert1206/engbers-projektzentrale-updates/contents/stable/Engbers_Projektzentrale_UPDATE_1_3_2_MIN.zip?ref=main'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              payload=json.loads(urllib.request.urlopen(req,timeout=30).read().decode('utf-8'))
              data=base64.b64decode(payload['content'])
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  names=z.namelist()
                  app_name=next((n for n in names if n.lower().endswith('app.py')),None)
                  if not app_name:
                      raise RuntimeError('app.py not found in '+str(names))
                  app=z.read(app_name).decode('utf-8')
              lines=app.splitlines()
              needles=['Suchergebnisse','Suchen','search','Statik','project_combo','Projekt','sidebar','nav','selected_project','current_project']
              hits=[]
              for i,line in enumerate(lines):
                  low=line.casefold()
                  if any(n.casefold() in low for n in needles):
                      hits.append((max(0,i-14),min(len(lines),i+32)))
              merged=[]
              for a,b in sorted(hits):
                  if merged and a<=merged[-1][1]+3:
                      merged[-1]=(merged[-1][0],max(merged[-1][1],b))
                  else:
                      merged.append((a,b))
              chunks=[]
              for a,b in merged:
                  chunk='\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b))
                  if any(x in chunk for x in ('Suchergebnisse','search_entry','search_var','Suchen','nav_items','Projekt-Explorer','Projektakte','Statik')):
                      chunks.append(chunk)
              text='\n\n===== CHUNK =====\n\n'.join(chunks)
              outpath.write_text(text[:180000],encoding='utf-8')
          except Exception as exc:
              outpath.write_text('INSPECTION ERROR (workflow kept successful): '+repr(exc)+'\n',encoding='utf-8')
          PY
      - name: Commit snippets
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add debug/base132_search_nav_snippets.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Inspect base app search and navigation snippets'
          git pull --rebase origin main
          git push origin main
