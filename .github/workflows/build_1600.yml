name: Build Engbers Projektzentrale 1.6.0
on:
  push:
    paths:
      - 'build/1600/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources
        run: |
          python -m py_compile build/1600/patch_1600.py build/1600/masterdata_v1600.py build/1600/post_update.py
          python - <<'PY'
          import importlib.util
          p='build/1600/masterdata_v1600.py'
          spec=importlib.util.spec_from_file_location('md1600',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          text='''Bauvorhaben:\nErrichtung eines Wohnhauses mit Garage\nBauort:\nBayerstr. 4, 48429 Rheine\nBauherr:\nNorbert u. Mariele Werning\nWehrstr. 39b, 48429 Rheine\nArchitekt:\nDipl.-Ing. Jochen Engelshove\nDieselstr. 3, 48485 Neuenkirchen\nTel.: 05973-909230\nE-Mail: info@engelshove.de\n'''
          d=m._parse(text)
          assert d['project_title']=='Errichtung eines Wohnhauses mit Garage', d
          assert d['project_zip']=='48429' and 'Rheine' in d['project_city'], d
          assert 'Werning' in d['client_name'], d
          print('Masterdata parser validation OK')
          PY
      - name: Build and validate update package
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_6_0_TINY.zip'
          payload=[('build/1600/patch_1600.py','patch_1600.py'),('build/1600/masterdata_v1600.py','masterdata_v1600.py'),('build/1600/post_update.py','post_update.py')]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:z.write(root/src,dst)
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={x[1] for x in payload}
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={'app':'Engbers Projektzentrale','channel':'stable','version':'1.6.0','published_at':'2026-09-16','min_bootstrap_version':'1.5.6','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_6_0_TINY.zip?rev=1600-masterdata','package_format':'zip','sha256':sha,'notes':'Version 1.6.0: Projektstammdaten 2.0. Architektenplaene werden anhand von Ordner und Dateinamen (Grundriss, Ansichten, Schnitte, Ausfuehrungsplan, Bauantrag usw.) priorisiert und im Hintergrund rein lesend ausgewertet. Bauvorhaben, Bauherr, Architekt und Tragwerksplanung erhalten getrennte Adress-, Telefon- und E-Mail-Felder. Erkannte Werte sind nur Vorschlaege und werden erst nach Bestaetigung gespeichert. Originaldateien bleiben unveraendert. Grundlage fuer die kommende automatische Word-Befuellung.','update_available':True}
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert hashlib.sha256(zip_path.read_bytes()).hexdigest()==manifest['sha256']
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_6_0_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.6.0 Projektstammdaten'
          git pull --rebase origin main
          git push origin main
