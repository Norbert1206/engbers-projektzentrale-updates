name: Build Engbers Projektzentrale 1.8.17
on:
  push:
    paths:
      - 'build/1817/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and patch stable 1.8.16
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1817
          mkdir -p /tmp/pz1817/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_16_TINY.zip?rev=1816-fixed-letter-grid' -o /tmp/pz1817/base.zip
          unzip -q /tmp/pz1817/base.zip -d /tmp/pz1817/unpacked
          python build/1817/patch_1817.py /tmp/pz1817/unpacked
      - name: Build update package and manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.')
          src=pathlib.Path('/tmp/pz1817/unpacked')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_17_TINY.zip'
          if zip_path.exists(): zip_path.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ('app.py','commercial_v1890.py','post_update.py','correspondence_v1814.py','contacts_v1814.py','letter_template_v1814.py'):
                  assert req in names, req
              assert 'anschreiben_template.docx' not in names
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.17','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_17_TINY.zip?rev=1817-letter-spacing-polish',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.17: Dezenter Feinschliff am Anschreiben ohne farbige oder verspielte Gestaltung. Die Grundstruktur aus 1.8.16 bleibt unverändert; Abstände zwischen Betreff, Auswahlblock, Anrede, Gruß und Unterschrift wurden harmonischer und kompakter abgestimmt. Die Beschriftung Weiterleitung an wurde typografisch bereinigt. Briefkopf, Adressbuch, lokale private Vorlage und alle bisherigen Funktionen bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_17_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.17 letter spacing polish'
          git pull --rebase origin main
          git push origin main
