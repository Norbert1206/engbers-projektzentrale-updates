name: Build Engbers Projektzentrale 1.4.40
on:
  push:
    paths:
      - 'build/1440/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1440/patch_1440.py
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('build/1440/patch_1440.py')
          spec=importlib.util.spec_from_file_location('p1440',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''APP_VERSION = "1.4.38"\ndef host():\n    top=object()\n    result_tree=object()\n    def _pz_1438_open_project(_evt=None):\n        try:\n            _iid=result_tree.identify_row(_evt.y)\n        except Exception:\n            _iid=''\n        if _pz_1438_activate_project('25-027 · Klee'):\n            try:top.after(70,top.destroy)\n            except Exception:pass\n            return 'break'\n    def _pz_1438_bind_project_open():\n        pass\n'''
          out,ok=m._patch_search(src)
          assert ok
          assert 'PZ_SEARCH_NAV_V1440' in out
          assert "Projekttreffer erkannt, aber der Projektwähler konnte nicht gefunden werden" in out
          assert "after(120,_switch_project)" in out
          compile(out,'synthetic_1440.py','exec')
          print('synthetic 1.4.40 test OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1440/patch_1440.py'
          starter=root/'build/1440/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_40_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1440.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.40','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_40_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.40','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.38','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_40_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.40: Reparaturupdate für 1.4.38/1.4.39. Der Versionswechsel ist nicht mehr von der Suchkorrektur abhängig. Die Projektnavigation aus der globalen Suche schließt das Suchfenster zuerst und sucht den Projektwähler anschließend generisch nach Projektnummer bzw. Projektbezeichnung. Bei einem echten Fehlschlag wird eine konkrete Meldung angezeigt.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_40_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_40_TINY.zip stable/update_1_4_40_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.40'
          git pull --rebase origin main
          git push origin main
