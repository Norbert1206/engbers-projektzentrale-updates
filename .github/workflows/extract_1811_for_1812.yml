name: Prepare Projektzentrale 1.8.12 source
on:
  push:
    paths:
      - 'build/1812/EXTRACT'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract current stable source
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1811
          mkdir -p /tmp/pz1811
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_11_TINY.zip?rev=1811-text-editor-fit' -o /tmp/pz1811/update.zip
          unzip -l /tmp/pz1811/update.zip | tee build/1812/package_contents.txt
          mkdir -p /tmp/pz1811/unpacked
          unzip -q /tmp/pz1811/update.zip -d /tmp/pz1811/unpacked
          for NAME in app.py commercial_v1890.py post_update.py; do
            SRC=$(find /tmp/pz1811/unpacked -type f -name "$NAME" -print -quit)
            if [ -z "$SRC" ]; then
              echo "$NAME not found in 1.8.11 package" >&2
              exit 2
            fi
            case "$NAME" in
              app.py) DST=build/1812/app_1811.py ;;
              commercial_v1890.py) DST=build/1812/commercial_v1890_1811.py ;;
              post_update.py) DST=build/1812/post_update_1811.py ;;
            esac
            cp "$SRC" "$DST"
            python -m py_compile "$DST"
          done
          grep -q 'APP_VERSION = "1.8.11"' build/1812/app_1811.py
      - name: Commit extracted source
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build/1812/app_1811.py build/1812/commercial_v1890_1811.py build/1812/post_update_1811.py build/1812/package_contents.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare 1.8.12 from stable 1.8.11 source'
          git pull --rebase origin main
          git push origin main
