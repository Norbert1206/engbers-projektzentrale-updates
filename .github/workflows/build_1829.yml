name: Build Engbers Projektzentrale 1.8.29
on:
  push:
    paths:
      - 'build/1829/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.28
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1829
          mkdir -p /tmp/pz1829/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_28_TINY.zip?rev=1828-outlook-diagnostic' -o /tmp/pz1829/base.zip
          unzip -q /tmp/pz1829/base.zip -d /tmp/pz1829/unpacked
          python build/1829/patch_1829.py /tmp/pz1829/unpacked
      - name: Verify transport
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('/tmp/pz1829/unpacked/outlook_archive_v1823.py').read_text(encoding='utf-8')
          d=Path('/tmp/pz1829/unpacked/outlook_diag_v1828.py').read_text(encoding='utf-8')
          assert 'PZ_RESULT_FILE' in a
          assert 'Out-File -LiteralPath $env:PZ_RESULT_FILE' in a
          assert 'from outlook_archive_v1823 import _powershell' in d
          print('OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1829/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_29_TINY.zip'
          if zp.exists(): zp.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.29','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_29_TINY.zip?rev=1829-powershell-tempfile-transport',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.29: Outlook-Kommunikation robuster. Die Rueckgabe aus Windows PowerShell wird nicht mehr ueber stdout gelesen, sondern ueber eine temporaere Ergebnisdatei. Das behebt Konfigurationen, in denen die gepackte Windows-App PowerShell-Ausgaben leer zurueckbekam, obwohl Outlook-Aktionen selbst funktionierten. Outlook-Diagnose und Mail-Leser verwenden jetzt denselben robusten Transport. Alle Funktionen aus 1.8.28 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_29_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.29 PowerShell transport'
          git pull --rebase origin main
          git push origin main
