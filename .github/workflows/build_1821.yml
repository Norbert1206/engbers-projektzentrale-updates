name: Build Engbers Projektzentrale 1.8.21
on:
  push:
    paths:
      - 'build/1821/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download stable 1.8.20 and patch
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1821
          mkdir -p /tmp/pz1821/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_20_TINY.zip?rev=1820-hidrive-share' -o /tmp/pz1821/base.zip
          unzip -q /tmp/pz1821/base.zip -d /tmp/pz1821/unpacked
          cp build/1821/share_basket_v1821.py /tmp/pz1821/unpacked/share_basket_v1821.py
          python build/1821/patch_1821.py /tmp/pz1821/unpacked
      - name: Smoke test project share basket
        run: |
          python - <<'PY'
          import importlib.util, pathlib, tempfile, os
          src=pathlib.Path('/tmp/pz1821/unpacked/share_basket_v1821.py')
          spec=importlib.util.spec_from_file_location('share_basket_v1821',src)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              os.environ['APPDATA']=str(base/'appdata')
              project=base/'project'; project.mkdir()
              (project/'Statik PDF').mkdir(); (project/'Plaene').mkdir(); (project/'Brandschutz').mkdir()
              (project/'Statik PDF'/'Statik.pdf').write_bytes(b'S')
              (project/'Plaene'/'Plan.dwg').write_bytes(b'P')
              (project/'Brandschutz'/'Nachweis.docx').write_bytes(b'B')
              added,total=m.add_items(1,[project/'Statik PDF'/'Statik.pdf',project/'Plaene',project/'Brandschutz'/'Nachweis.docx'],project)
              assert added==3 and total==3
              items=m.get_items(1); assert len(items)==3
              assert m.count_items(1)==3
              m.remove_indices(1,[2]); assert m.count_items(1)==2
              m.clear_items(1); assert m.count_items(1)==0
          print('Projektfreigabekorb smoke test OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1821/unpacked')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_21_TINY.zip'
          if zip_path.exists(): zip_path.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ('app.py','post_update.py','share_basket_v1821.py','hidrive_share_v1820.py'):
                  assert req in names,req
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.21','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_21_TINY.zip?rev=1821-share-basket',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.21: Projektweiter Freigabekorb für beliebige Dateitypen. Dateien und Ordner können aus Statik PDF und dem Projekt-Explorer gesammelt zur Freigabe hinzugefügt werden – z.B. Statik, Pläne, Brandschutz, Word, DWG, Bilder oder weitere Unterlagen. Ein gemeinsamer Freigabeordner wird in HiDrive angelegt; Originaldateien bleiben unverändert. Der Korb wird lokal pro Projekt gespeichert und kann auch externe Einzeldateien aufnehmen. Alle Funktionen aus 1.8.20 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_21_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.21 share basket'
          git pull --rebase origin main
          git push origin main
