name: Build Engbers Projektzentrale 1.8.25
on:
  push:
    paths:
      - 'build/1825/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable 1.8.24
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1825
          mkdir -p /tmp/pz1825/unpacked
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_24_TINY.zip?rev=1824-outlook-sync-hotfix' -o /tmp/pz1825/base.zip
          unzip -q /tmp/pz1825/base.zip -d /tmp/pz1825/unpacked
          python build/1825/patch_1825.py /tmp/pz1825/unpacked
      - name: Static smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pz1825/unpacked/outlook_archive_v1823.py').read_text(encoding='utf-8')
          assert '$stores.Item($s)' in p
          assert 'ConvertTo-Json -InputObject $sorted' in p
          assert 'foreach ($store in @($ns.Stores))' not in p
          print('OK')
          PY
      - name: Build package and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.'); src=pathlib.Path('/tmp/pz1825/unpacked')
          zp=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_25_TINY.zip'
          if zp.exists(): zp.unlink()
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,p.relative_to(src).as_posix())
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.25','published_at':'2026-09-18',
            'min_bootstrap_version':'1.8.3',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_25_TINY.zip?rev=1825-outlook-store-enumeration',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.25: Hotfix fuer die Outlook-Mailauswahl. Outlook-Konten und Datenspeicher werden jetzt einzeln aus der COM-Store-Sammlung gelesen, damit Posteingang und Gesendete Elemente korrekt geladen werden. Leere Trefferlisten werden weiterhin sauber behandelt. Alle Funktionen aus 1.8.24 bleiben erhalten.',
            'update_available':True
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(sha)
          PY
      - name: Commit release
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_25_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.25 Outlook store enumeration'
          git pull --rebase origin main
          git push origin main
