name: Build Engbers Projektzentrale 1.4.35
on:
  push:
    paths:
      - 'build/1435/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1435/patch_1435.py
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('build/1435/patch_1435.py')
          spec=importlib.util.spec_from_file_location('p1435',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''APP_VERSION = "1.4.33"\nclass Demo:\n    def render_statik(self):\n        current_project={'folder':'C:/X','name':'X'}\n        content=None\n        ptr=ttk.Treeview(content,columns=('gruppe','mb_projekt','pos','bezeichnung','modul','kennwert'),show='headings')\n        _position_status_values=('Offen','In Bearbeitung','Geprüft','Änderung erforderlich','Erledigt')\n        # Zusätzliche Statusspalte rechts an die bestehende Positionsliste anhängen.\n        try:\n            _cols=list(ptr.cget('columns'))\n            if 'pz_bearbeitung' not in _cols:\n                _cols.append('pz_bearbeitung')\n                ptr.configure(columns=tuple(_cols))\n            ptr.heading('pz_bearbeitung',text='Bearbeitung')\n            ptr.column('pz_bearbeitung',width=130,minwidth=105,stretch=False,anchor='w')\n        except Exception:\n            pass\n        def x():\n            status_index=0;status='Offen';iid='x'\n            vals=list(ptr.item(iid,'values'))\n            vals[status_index]=status\n            ptr.item(iid,values=tuple(vals))\n        # Baugrund / Bodengutachten:\n        ground=ttk.LabelFrame(content,text='BAUGRUND / BODENGUTACHTEN')\n    def search(self):\n        top=tk.Toplevel(self)\n        top.title('Suchergebnisse')\n        result_tree=ttk.Treeview(top,columns=('bereich','treffer'),show='headings')\n        result_tree.pack()\n'''
          a=m._patch_status(src); compile(a,'a.py','exec')
          b=m._patch_search(a); compile(b,'b.py','exec')
          c=m._patch_pdf(b); compile(c,'c.py','exec')
          assert "APP_VERSION = \"1.4.33\"" in c
          assert "text='Status'" in c
          assert 'def _pz_open_search_project' in c
          assert 'STATIK PDF · SCHNELLZUGRIFF' in c
          print('synthetic repair test OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1435/patch_1435.py'
          starter=root/'build/1435/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_35_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1435.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.35','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_35_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.35','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.33','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_35_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.35: Reparaturupdate für die fehlgeschlagene 1.4.34-Installation. Das Update kann direkt von 1.4.33 oder 1.4.34 installiert werden, beendet die wiederholte Update-Anzeige und übernimmt die kompakte Statusspalte, Projektnavigation aus der globalen Suche sowie den Statik-PDF-Schnellzugriff, soweit die vorhandene Installation die jeweiligen sicheren Einfügepunkte enthält.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_35_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_35_TINY.zip stable/update_1_4_35_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.35'
          git pull --rebase origin main
          git push origin main
