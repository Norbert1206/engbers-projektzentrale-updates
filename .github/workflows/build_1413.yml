name: Build Engbers Projektzentrale 1.4.13
on:
  push:
    paths:
      - 'build/1413/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1413/patch_1413.py
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1413/patch_1413.py'
          starter=root/'build/1413/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_13_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1413.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          package={
              'version':'1.4.13',
              'filename':zip_path.name,
              'sha256':sha,
              'payload_b64':base64.b64encode(data).decode('ascii'),
          }
          (root/'stable/update_1_4_13_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale',
              'channel':'stable',
              'version':'1.4.13',
              'published_at':'2026-09-14',
              'min_bootstrap_version':'1.4.12',
              'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_13_tiny.json',
              'package_format':'base64-json',
              'sha256':sha,
              'notes':'Version 1.4.13: Die Positionsakte ermittelt zusätzlich die konkrete mb-Modellquelle je Position. MicroFe-Positionen werden der tatsächlich passenden FEM-Datenbank zugeordnet; bei BauStatik wird der Projekt-/Modellcontainer ausgewiesen und – wenn eindeutig lesbar – eine Modell-/Projektbezeichnung übernommen. Angezeigt werden mb-Modell und Modellquelle. Alles bleibt read-only; der Startweg über den mb ProjektManager bleibt unverändert.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          again=json.loads((root/'stable/update_1_4_13_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(again['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          with zipfile.ZipFile(zip_path) as z:
              assert set(z.namelist())=={'patch_1413.py','START_PROJEKTZENTRALE.cmd'}
          src=patch.read_text(encoding='utf-8')
          for required in ('APP_VERSION = "1.4.13"','def _mb_model_for_position','mb-Modell: {model_name}','Modellquelle: {model_source}'):
              assert required in src
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_13_TINY.zip stable/update_1_4_13_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.13'
          git pull --rebase origin main
          git push origin main
