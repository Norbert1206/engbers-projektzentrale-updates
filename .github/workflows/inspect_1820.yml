name: Inspect Projektzentrale 1.8.19 for 1.8.20
on:
  push:
    paths:
      - 'build/1820/INSPECT'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current stable source
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1820
          mkdir -p /tmp/pz1820
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_19_TINY.zip?rev=1819-ai-result-fix' -o /tmp/pz1820/base.zip
          unzip -q /tmp/pz1820/base.zip -d /tmp/pz1820/src
          echo '=== FILES ==='
          find /tmp/pz1820/src -maxdepth 2 -type f | sort
          echo '=== ORDNER OEFFNEN MATCHES ==='
          grep -Rni -C 12 --include='*.py' 'ORDNER ÖFFNEN\|ORDNER OEFFNEN\|Ordner öffnen\|Ordner oeffnen' /tmp/pz1820/src || true
          echo '=== STATIK PDF MATCHES ==='
          grep -Rni -C 20 --include='*.py' 'Statik PDF\|STATIK PDF\|statik_pdf\|statik pdf' /tmp/pz1820/src | head -n 500 || true
