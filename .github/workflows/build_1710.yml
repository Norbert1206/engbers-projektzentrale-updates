name: Build Engbers Projektzentrale 1.7.10
on:
  push:
    paths:
      - 'build/1710/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate global Adobe UI search patch
        run: |
          python -m py_compile build/1710/patch_1710.py build/1710/post_update.py
          python - <<'PY'
          import pathlib,runpy
          root=pathlib.Path('.')
          p=runpy.run_path(str(root/'build/1710/patch_1710.py'),run_name='defs1710')
          src='HEADER\n'+p['OLD_BLOCK']+'\nFOOTER\n'
          out=p['_patch_mod'](src)
          assert p['OLD_BLOCK'] not in out
          assert 'PZ_ADOBE_UI_GLOBAL_SEARCH_V1710' in out
          assert '$root=Get-Root' in out
          assert "($n -like '*Adobe PDF*')" in out
          assert 'im gesamten Windows-UI nicht gefunden' in out
          print('1.7.10 global Adobe UI search patch validation OK')
          PY
      - name: Build and validate update package
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_7_10_TINY.zip'
          payload=[('build/1710/patch_1710.py','patch_1710.py'),('build/1710/post_update.py','post_update.py')]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:z.write(root/src,dst)
          with zipfile.ZipFile(zip_path) as z:assert z.testzip() is None
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.7.10','published_at':'2026-09-17',
              'min_bootstrap_version':'1.7.9',
              'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_7_10_TINY.zip?rev=1710-global-adobe-ui',
              'package_format':'zip','sha256':sha,
              'notes':'Version 1.7.10: Der sichtbare Word-Befehl Als Adobe PDF speichern wird nach dem Oeffnen der Datei jetzt im gesamten Windows-UI-Baum gesucht, weil Word den Backstage-Bereich technisch ausserhalb des normalen Dokumentfensters darstellen kann. Zusaetzlicher Fallback sucht nach jedem UI-Element, dessen Name Adobe PDF enthaelt.',
              'update_available':True}
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_7_10_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.7.10 global Adobe UI search'
          git pull --rebase origin main
          git push origin main
