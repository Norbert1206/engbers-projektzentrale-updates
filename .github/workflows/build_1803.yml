name: Build Engbers Projektzentrale 1.8.3
on:
  push:
    paths:
      - 'build/1803/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 1.8.2 to 1.8.3 installer
        run: |
          python -m py_compile build/1803/patch_1803.py build/1803/post_update.py
          python - <<'PY'
          import pathlib,tempfile,shutil,subprocess,sys
          root=pathlib.Path('.')
          with tempfile.TemporaryDirectory() as td:
              d=pathlib.Path(td)
              (d/'app.py').write_text('APP_VERSION = "1.8.2"\n',encoding='utf-8')
              (d/'wordforms_v1700.py').write_text(
                  'from pathlib import Path\nimport os,datetime,tempfile,subprocess,shutil\n\n'
                  'def _stamp_approved_pdf(docx_path,pdf_path,asset_path):\n'
                  '    return False,"alter Word-Stempelweg"\n\n'
                  'def open_wordforms(app):\n    pass\n',encoding='utf-8')
              shutil.copy2(root/'build/1803/patch_1803.py',d/'patch_1803.py')
              shutil.copy2(root/'build/1803/post_update.py',d/'post_update.py')
              cp=subprocess.run([sys.executable,str(d/'post_update.py')],cwd=d,capture_output=True,text=True)
              if cp.returncode:
                  print(cp.stdout); print(cp.stderr)
                  err=d/'update_1803_error.txt'
                  if err.exists(): print(err.read_text(encoding='utf-8'))
              assert cp.returncode==0
              app=(d/'app.py').read_text(encoding='utf-8')
              mod=(d/'wordforms_v1700.py').read_text(encoding='utf-8')
              assert 'APP_VERSION = "1.8.3"' in app
              assert 'PZ_SASV_DIRECT_PDF_STAMP_V1803' in mod
              active=mod[mod.find('PZ_SASV_DIRECT_PDF_STAMP_V1803'):mod.find('\ndef open_wordforms',mod.find('PZ_SASV_DIRECT_PDF_STAMP_V1803'))]
              for required in ('AcroExch.PDDoc','addWatermarkFromFile','System.Drawing.dll','transparent-png','overlay-pdf','acrobat-stamp'):
                  assert required in active,required
              assert 'shutil.copy2(docx_path' not in active
              assert 'doc=word.Documents.Open' not in active
              assert (d/'update_1803_install.log').exists()
          print('1.8.3 installer/direct-PDF stamp validation OK')
          PY
      - name: Build update package
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_8_3_TINY.zip'
          payload=[('build/1803/patch_1803.py','patch_1803.py'),('build/1803/post_update.py','post_update.py')]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload: z.write(root/src,dst)
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'patch_1803.py','post_update.py'}
              assert all(not n.lower().endswith(('.png','.jpg','.jpeg')) for n in z.namelist())
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={
            'app':'Engbers Projektzentrale','channel':'stable','version':'1.8.3','published_at':'2026-09-17',
            'min_bootstrap_version':'1.8.2',
            'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_3_TINY.zip?rev=1803-direct-pdf-stamp',
            'package_format':'zip','sha256':sha,
            'notes':'Version 1.8.3: FREIGEBEN & STEMPELN arbeitet direkt auf der bereits geprueften PDF. Das Word-Original wird beim Stempeln nicht mehr geoeffnet oder veraendert. Die lokale PNG wird intern transparent aufbereitet und nur auf Seite 1 der PDF gelegt; die echte Grafik bleibt lokal und ist nicht Bestandteil des Update-Pakets.',
            'update_available':True}
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_8_3_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.8.3 direct PDF stamp'
          git pull --rebase origin main
          git push origin main
