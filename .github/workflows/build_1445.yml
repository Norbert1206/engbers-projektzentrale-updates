name: Build Engbers Projektzentrale 1.4.45
on:
  push:
    paths:
      - 'build/1445/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch
        run: |
          python -m py_compile build/1445/patch_1445.py
          python - <<'PY'
          from pathlib import Path
          text=Path('build/1445/patch_1445.py').read_text(encoding='utf-8')
          required=(
              'PZ_STATIK_PDF_NAV_V1445',
              'PZ_STATIK_PDF_VIEW_V1445',
              'PZ_PROJECT_EXPLORER_OPEN_V1445',
              'PZ_METADATA_DIR_V1445',
              'PZ_POSITION_LAYOUT_V1445',
              'PZ_SEARCH_PROJECT_FILE_V1445',
              'APP_VERSION = "1.4.44"',
              'APP_VERSION = "1.4.45"',
          )
          for marker in required:
              assert marker in text, marker
          assert "_compile_text(s,'app.py.1445.features.check')" in text
          assert "shutil.copy2(APP" in text
          print('1.4.45 patch validation OK')
          PY
      - name: Build update package
        run: |
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_45_TINY.zip'
          payload=[
              ('build/1445/patch_1445.py','patch_1445.py'),
              ('build/1445/START_PROJEKTZENTRALE.cmd','START_PROJEKTZENTRALE.cmd'),
          ]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:z.write(root/src,dst)
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.45','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_45_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.45','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.44','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_45_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.45: Projekt-Explorer öffnet Dateien zuverlässig per Doppelklick/Enter und kann sie im Windows-Explorer zeigen. Statik PDF ist ein eigener Unterbereich mit PDF-Liste, Suche und Ordnerzugriff. Die Positionsakte erhält klare Spaltenköpfe und blendet im Einzelprojekt die horizontale Leiste aus. Projektzentrale-Metadaten werden in den versteckten Ordner .engbers migriert. Die globale Suche findet zusätzlich indexierte Projektdateien und öffnet deren Originale.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_45_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_45_TINY.zip stable/update_1_4_45_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.45'
          git pull --rebase origin main
          git push origin main
