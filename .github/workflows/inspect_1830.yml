name: Inspect 1.8.29 communication filters
on:
  push:
    paths:
      - 'build/1830/INSPECT'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect communication view
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1830
          mkdir -p /tmp/pz1830/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_29_TINY.zip?rev=1829-powershell-tempfile-transport' -o /tmp/pz1830/base.zip
          unzip -q /tmp/pz1830/base.zip -d /tmp/pz1830/src
          grep -n -A150 -B10 'def show_comm' /tmp/pz1830/src/app.py
