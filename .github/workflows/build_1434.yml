name: Build Engbers Projektzentrale 1.4.34
on:
  push:
    paths:
      - 'build/1434/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1434/patch_1434.py
          python - <<'PY'
          import importlib.util, pathlib, py_compile, tempfile
          patch_path=pathlib.Path('build/1434/patch_1434.py')
          spec=importlib.util.spec_from_file_location('patch_1434_test',patch_path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          src='''APP_VERSION = "1.4.33"\nclass Demo:\n    def render_statik(self):\n        current_rows=[]\n        item_rows={}\n        ptr=ttk.Treeview(content,columns=('gruppe','mb_projekt','pos','bezeichnung','modul','kennwert'),show='headings')\n        pos_info=ttk.Label(content,text='x')\n        _position_status_values=('Offen','In Bearbeitung','Geprüft','Änderung erforderlich','Erledigt')\n        # Zusätzliche Statusspalte rechts an die bestehende Positionsliste anhängen.\n        try:\n            _cols=list(ptr.cget('columns'))\n            if 'pz_bearbeitung' not in _cols:\n                _cols.append('pz_bearbeitung')\n                ptr.configure(columns=tuple(_cols))\n            ptr.heading('pz_bearbeitung',text='Bearbeitung')\n            ptr.column('pz_bearbeitung',width=130,minwidth=105,stretch=False,anchor='w')\n        except Exception:\n            pass\n        _position_status_filter_var=None\n        def _position_status_apply_to_tree():\n            status_index=0\n            status='Offen'\n            iid='x'\n            try:\n                vals=list(ptr.item(iid,'values'))\n                while len(vals)<=status_index:\n                    vals.append('')\n                vals[status_index]=status\n                ptr.item(iid,values=tuple(vals))\n            except Exception:\n                pass\n        _status_combo=ttk.Combobox(\n            content,\n            textvariable=_position_status_filter_var,\n            values=('Alle',)+_position_status_values,\n            state='readonly',\n            width=20,\n        )\n        # Baugrund / Bodengutachten:\n        b_ground=ttk.LabelFrame(content,text='BAUGRUND / BODENGUTACHTEN')\n        b_ground.pack(fill='x')\n\n    def global_search(self):\n        q='Klee'\n        top=tk.Toplevel(self)\n        top.title(f'Suchergebnisse für „{q}“')\n        result_tree=ttk.Treeview(top,columns=('bereich','treffer'),show='headings')\n        result_tree.pack()\n'''
          out=mod._patch_status_ui(src)
          assert "ptr.heading('pz_bearbeitung',text='Status')" in out
          assert "_position_status_display.get(status,status)" in out
          out=mod._patch_search_navigation(out)
          assert 'def _pz_open_search_project' in out
          assert "result_tree.bind('<Double-1>'" in out
          out=mod._patch_statik_pdf(out)
          assert 'STATIK PDF · SCHNELLZUGRIFF' in out
          assert "content,text='STATIK PDF · SCHNELLZUGRIFF'" in out
          compile(out,'synthetic_app.py','exec')
          print('Synthetic patch test OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1434/patch_1434.py'
          starter=root/'build/1434/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_34_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1434.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.34','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_34_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.34','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.33','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_34_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.34: Die Statik-Oberfläche wird kompakter: der Bearbeitungsstatus steht direkt bei der Position. Projekttreffer der globalen Suche wechseln per Doppelklick unmittelbar in das gefundene Projekt. Zusätzlich zeigt Statik den Projektordner „Statik PDF“ als PDF-Schnellzugriff mit Ordner öffnen, Aktualisieren und Doppelklick auf PDFs.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          again=json.loads((root/'stable/update_1_4_34_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(again['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          with zipfile.ZipFile(zip_path) as z:
              assert set(z.namelist())=={'patch_1434.py','START_PROJEKTZENTRALE.cmd'}
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_34_TINY.zip stable/update_1_4_34_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.34'
          git pull --rebase origin main
          git push origin main
