name: Build Engbers Projektzentrale 1.4.44
on:
  push:
    paths:
      - 'build/1444/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1444/patch_1444.py build/1444/patch_1444_ui.py build/1444/patch_1444_positions.py
          python - <<'PY'
          from pathlib import Path
          files=[Path('build/1444/patch_1444.py'),Path('build/1444/patch_1444_ui.py'),Path('build/1444/patch_1444_positions.py')]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          for marker in ('PZ_STATIK_PDF_NAV_V1444','PZ_STATIK_PDF_ROOT_V1444','def _position_layout_1444()',"win.title('Kategorie wählen')",'PZ_SEARCH_DOCUMENT_OPEN_V1444'):
              assert marker in text, marker
          print('1.4.44 patch markers OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_44_TINY.zip'
          payload=[
              ('build/1444/patch_1444.py','patch_1444.py'),
              ('build/1444/patch_1444_ui.py','patch_1444_ui.py'),
              ('build/1444/patch_1444_positions.py','patch_1444_positions.py'),
              ('build/1444/START_PROJEKTZENTRALE.cmd','START_PROJEKTZENTRALE.cmd'),
          ]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:z.write(root/src,dst)
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.44','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_44_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.44','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.43','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_44_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.44: Positionsakte kompakter und Statusdarstellung korrigiert; Statusfilter bleibt mit Suche/Gruppe kombiniert. Manuelle Positionsdateien erhalten eine Kategorieauswahl und aktualisieren sofort. Statik PDF nutzt den richtigen Projektordner und hat links einen Unterpunkt. Dokumenttreffer der globalen Suche lassen sich per Doppelklick öffnen.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_44_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_44_TINY.zip stable/update_1_4_44_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.44'
          git pull --rebase origin main
          git push origin main
