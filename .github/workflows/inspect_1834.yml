name: Inspect 1.8.33 share basket actions
on:
  push:
    paths:
      - 'build/1834/INSPECT'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stable 1.8.33 basket tail
        run: |
          set -euo pipefail
          rm -rf /tmp/pz1834
          mkdir -p /tmp/pz1834/src
          curl -fL 'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_8_33_TINY.zip?rev=1833-hidrive-default-redirect' -o /tmp/pz1834/base.zip
          unzip -q /tmp/pz1834/base.zip -d /tmp/pz1834/src
          sed -n '250,520p' /tmp/pz1834/src/share_basket_v1821.py
          sed -n '1,420p' /tmp/pz1834/src/hidrive_oauth_v1832.py
