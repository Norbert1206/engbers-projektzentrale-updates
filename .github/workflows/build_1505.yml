name: Build Engbers Projektzentrale 1.5.5
on:
  push:
    paths:
      - 'build/1505/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch source
        run: |
          python -m py_compile build/1505/patch_1505.py
          grep -q 'PZ_PROJECT_EXPLORER_QUEUE_V1505' build/1505/patch_1505.py
          grep -q 'PZ-Filesystem-Only' build/1505/patch_1505.py
      - name: Build and validate update package
        run: |
          python - <<'PY'
          import pathlib, zipfile, hashlib, json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_5_5_TINY.zip'
          payload=[
              ('build/1505/patch_1505.py','patch_1505.py'),
              ('build/1505/post_update.py','post_update.py'),
              ('build/1505/pz_launcher.vbs','pz_launcher.vbs'),
              ('build/1505/updater.py','updater.py'),
              ('build/1505/START_PROJEKTZENTRALE.cmd','START_PROJEKTZENTRALE.cmd'),
              ('build/1505/START_PROJEKTZENTRALE_144.cmd','START_PROJEKTZENTRALE_144.cmd'),
          ]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:
                  z.write(root/src,dst)
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for _,dst in payload: assert dst in names, dst
          data=zip_path.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          manifest={
              'app':'Engbers Projektzentrale',
              'channel':'stable',
              'version':'1.5.5',
              'published_at':'2026-09-16',
              'min_bootstrap_version':'1.5.4',
              'package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_5_5_TINY.zip?rev=1505-actions',
              'package_format':'zip',
              'sha256':sha,
              'notes':'Version 1.5.5: Saemtliche Dateisystem-I/O des Projekt-Explorers laeuft ausserhalb des Tk-Hauptthreads. Der Worker kommuniziert ausschliesslich ueber Queue; alle Tkinter-Aufrufe bleiben im Hauptthread. Grosse Ordner werden portionsweise dargestellt. Bei einer Blockade schreibt ein Hang-Waechter project_explorer_hang.log. Zusaetzlich wird START_PROJEKTZENTRALE_144.cmd ersetzt, falls ein alter Desktop-Shortcut noch darauf zeigt.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          verify=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert verify==manifest['sha256']
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_5_5_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.5.5 verified package'
          git pull --rebase origin main
          git push origin main
