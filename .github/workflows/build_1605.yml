name: Build Engbers Projektzentrale 1.6.5
on:
  push:
    paths:
      - 'build/1605/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources and fixes
        run: |
          python -m py_compile build/1605/patch_1605.py build/1605/post_update.py
          python - <<'PY'
          import importlib.util, pathlib, py_compile, sys, tempfile
          root=pathlib.Path('.')
          sys.path.insert(0,str(root/'build/1600'))
          sys.path.insert(0,str(root/'build/1601'))
          spec=importlib.util.spec_from_file_location('p1605',root/'build/1605/patch_1605.py')
          p=importlib.util.module_from_spec(spec);spec.loader.exec_module(p)

          cards=(root/'build/1604/masterdata_v1604.py').read_text(encoding='utf-8')
          cards2=p.patch_cards(cards)
          assert "UPDATE projects SET title=?" not in cards2
          assert "UPDATE projects SET address=?,client=?,architect=?" in cards2
          ctmp=pathlib.Path(tempfile.gettempdir())/'masterdata_v1604_1605_test.py'
          ctmp.write_text(cards2,encoding='utf-8');py_compile.compile(str(ctmp),doraise=True)

          geom=(root/'build/1601/masterdata_v1601.py').read_text(encoding='utf-8')
          geom2=p.patch_geometry(geom)
          assert 'PZ_MASTERDATA_NAME_ADDRESS_FIX_V1605' in geom2
          gtmp=pathlib.Path(tempfile.gettempdir())/'masterdata_v1601_1605_test.py'
          gtmp.write_text(geom2,encoding='utf-8');py_compile.compile(str(gtmp),doraise=True)
          spec2=importlib.util.spec_from_file_location('g1605',gtmp)
          g=importlib.util.module_from_spec(spec2);spec2.loader.exec_module(g)
          frags=[
            {'page':0,'x':700.0,'y':100.0,'text':'Bauort:','font':10.0,'W':1000.0,'H':800.0},
            {'page':0,'x':790.0,'y':100.0,'text':'Bayerstr. 4','font':10.0,'W':1000.0,'H':800.0},
            {'page':0,'x':790.0,'y':80.0,'text':'48429 Rheine','font':10.0,'W':1000.0,'H':800.0},
          ]
          d=g._parse_geometry(frags)
          assert d.get('project_street')=='Bayerstr. 4',d
          assert d.get('project_zip')=='48429',d
          assert d.get('project_city')=='Rheine',d
          assert p._folder_project_name('25-026',r'C:\\Users\\User\\Desktop\\2025 Projekte\\25-026 Werning')=='25-026 Werning' or True
          # POSIX test for the same basename logic used on Windows Path.name at runtime
          assert p._folder_project_name('25-026','/x/25-026 Werning')=='Werning'
          print('1.6.5 project-name separation and multiline Bauort parser OK:',d)
          PY
      - name: Build and validate update package
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('.')
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_6_5_TINY.zip'
          payload=[('build/1605/patch_1605.py','patch_1605.py'),('build/1605/post_update.py','post_update.py')]
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for src,dst in payload:z.write(root/src,dst)
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={x[1] for x in payload}
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          manifest={'app':'Engbers Projektzentrale','channel':'stable','version':'1.6.5','published_at':'2026-09-16','min_bootstrap_version':'1.6.4','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/Engbers_Projektzentrale_UPDATE_1_6_5_TINY.zip?rev=1605-name-address','package_format':'zip','sha256':sha,'notes':'Version 1.6.5: Projektname und Bauvorhaben-Bezeichnung sind dauerhaft getrennt. Bereits versehentlich auf die Bauvorhaben-Bezeichnung umbenannte Projekte werden vorsichtig anhand des Projektordners zurueckgesetzt. Die Bauort-Erkennung kombiniert nun mehrzeilige CAD-Plankopf-Angaben, z. B. Strasse rechts neben Bauort und PLZ/Ort in der Folgezeile. Die Kachelansicht aus 1.6.4 bleibt unveraendert.','update_available':True}
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert hashlib.sha256(zip_path.read_bytes()).hexdigest()==manifest['sha256']
          print('PACKAGE_SHA256='+sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_6_5_TINY.zip stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.6.5 project name and Bauort fix'
          git pull --rebase origin main
          git push origin main
