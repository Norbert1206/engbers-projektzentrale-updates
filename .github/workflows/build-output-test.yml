name: Build Statiktools Output Test
on:
  push:
    paths:
      - 'statiktools/build_output_test.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1.20.15
        shell: python
        run: |
          import base64, io, json, zipfile, hashlib, pathlib
          root=pathlib.Path("statiktools/stable")
          src=json.loads((root/"package_1_20_15.json").read_text(encoding="utf-8"))
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(src["data_base64"])))
          files={n:z.read(n) for n in z.namelist()}
          html=files["index.html"].decode("utf-8")
          if "js/output_test.js" not in html:
              html=html.replace("</body>",'<script src="js/output_test.js"></script>\n</body>')
          files["index.html"]=html.encode()
          files["VERSION.txt"]=b"1.20.15\n"
          js=r'''(() => {
            function cleanClone(){
              const c=document.documentElement.cloneNode(true);
              c.querySelectorAll("#eng-output-test,button[title='Vier Ausgabewege vergleichen'],script").forEach(x=>x.remove());
              return c;
            }
            function fullDoc(mode){
              const win=window.open("","_blank");
              const c=cleanClone();
              win.document.open(); win.document.write("<!doctype html>"+c.outerHTML); win.document.close();
              const st=win.document.createElement("style");
              st.textContent="@page{size:A4 portrait;margin:10mm} @media print{#eng-output-test{display:none!important}}";
              win.document.head.appendChild(st);
              win.document.title="Engbers Ausgabedokument – "+mode;
              setTimeout(()=>win.print(),500);
            }
            function currentPrint(){
              const s=document.createElement("style"); s.id="eng-print-clean";
              s.textContent="@page{size:A4 portrait;margin:10mm}@media print{#eng-output-test,button[title='Vier Ausgabewege vergleichen']{display:none!important}}";
              document.head.appendChild(s); window.print(); setTimeout(()=>s.remove(),1000);
            }
            function pageClone(){
              const candidates=[...document.querySelectorAll("main,.report,.output,.print-preview,.document-view,[class*='report'],[class*='output'],[class*='document']")];
              const el=candidates.sort((a,b)=>b.scrollHeight*b.scrollWidth-a.scrollHeight*a.scrollWidth)[0];
              if(!el){alert("Kein kompletter Ausgabebereich erkannt.");return}
              const win=window.open("","_blank");
              win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Engbers Dokumenttest</title><style>@page{size:A4 portrait;margin:10mm}body{margin:0;font-family:Arial,sans-serif}.sheet{width:190mm;margin:auto}svg{max-width:100%;height:auto}</style></head><body><div class="sheet"></div></body></html>');
              win.document.querySelector(".sheet").appendChild(win.document.adoptNode(el.cloneNode(true))); win.document.close();
            }
            function panel(){
              let d=document.getElementById("eng-output-test"); if(d){d.remove();return}
              d=document.createElement("div");d.id="eng-output-test";d.style.cssText="position:fixed;right:18px;top:92px;z-index:999999;background:#fff;border:1px solid #9aa7b1;border-radius:8px;box-shadow:0 8px 30px #0003;padding:12px;font:13px Segoe UI;min-width:285px";
              d.innerHTML='<b>Ausgabe-Test 1.20.15</b><div style="margin-top:8px;display:grid;gap:7px"><button id="e1">E · Gesamte aktuelle Ausgabe drucken</button><button id="e2">F · Komplettes Dokument klonen + drucken</button><button id="e3">G · Ausgabebereich als A4-Dokument</button><button id="e4">H · bisherige PDF-Ausgabe</button></div><div style="margin-top:8px;font-size:11px;color:#566">Keine Einzel-SVG mehr. Rechenkern unverändert.</div>';
              document.body.appendChild(d);
              d.querySelector("#e1").onclick=currentPrint; d.querySelector("#e2").onclick=()=>fullDoc("F"); d.querySelector("#e3").onclick=pageClone;
              d.querySelector("#e4").onclick=()=>{const x=[...document.querySelectorAll("button,a")].find(x=>/PDF öffnen|PDF/i.test((x.innerText||"").trim()));if(x)x.click();else alert("PDF-Button nicht gefunden.")};
            }
            const btn=document.createElement("button");btn.type="button";btn.textContent="🖨 Ausgabe-Test 2";btn.title="Ausgabewege E bis H";btn.style.cssText="position:fixed;right:18px;top:48px;z-index:999998;padding:8px 12px;border:1px solid #9aa7b1;border-radius:6px;background:#fff;font:13px Segoe UI;cursor:pointer";btn.onclick=panel;
            window.addEventListener("DOMContentLoaded",()=>document.body.appendChild(btn));
          })();'''
          files["js/output_test.js"]=js.encode("utf-8")
          out=io.BytesIO()
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as q:
              for n,b in files.items(): q.writestr(n,b)
          raw=out.getvalue(); sha=hashlib.sha256(raw).hexdigest()
          pkg={"format":"base64-json","version":"1.20.15","sha256":sha,"data_base64":base64.b64encode(raw).decode()}
          (root/"package_1_20_15.json").write_text(json.dumps(pkg,separators=(",",":")),encoding="utf-8")
          manifest={
            "version":"1.20.15","update_available":True,
            "notes":"Ausgabe-Test 2: E komplette aktuelle Ausgabe, F vollständiger Dokumentklon, G erkannter Ausgabebereich als A4-Dokument, H alter PDF-Weg. Keine Einzel-SVG mehr. Rechenkern unverändert.",
            "package_url":"https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/statiktools/stable/package_1_20_15.json?v=202610071205",
            "package_format":"base64-json","sha256":sha}
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
      - name: Commit update
        run: |
          git config user.name "Engbers Update Builder"
          git config user.email "actions@users.noreply.github.com"
          git add statiktools/stable/package_1_20_15.json statiktools/stable/manifest.json
          git commit -m "Statiktools 1.20.15 output test" || exit 0
          git push
