name: Build Statiktools Output Test
'on':
  push:
    paths:
      - 'statiktools/build_output_test.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1.20.20
        shell: python
        run: |
          import base64, io, json, zipfile, hashlib, pathlib
          root=pathlib.Path("statiktools/stable")
          src=json.loads((root/"package_1_20_16.json").read_text(encoding="utf-8"))
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(src["data_base64"])))
          files={n:z.read(n) for n in z.namelist()}
          html=files["index.html"].decode("utf-8")
          import re
          html=re.sub(r'<script[^>]+src=["\']js/output_test\.js["\'][^>]*></script>','',html,flags=re.I)
          tag='<script src="js/output_test.js?v=12020"></script>'
          if re.search(r'</body\s*>',html,re.I):
              html=re.sub(r'</body\s*>',tag+'\n</body>',html,count=1,flags=re.I)
          else:
              html += '\n'+tag+'\n'
          inline='''<script id="engbers-output-inline">
          (function(){
           function install(){
            if(document.getElementById('engbers-output-document-btn')) return;
            var b=document.createElement('button');
            b.id='engbers-output-document-btn'; b.textContent='Engbers-Ausgabedokument';
            b.style.cssText='position:fixed;right:18px;top:78px;z-index:2147483647;padding:9px 13px;background:#fff;border:2px solid #087f73;border-radius:6px;font-weight:700';
            b.onclick=function(){alert('Engbers-Ausgabedokument 1.20.20 aktiv');};
            (document.body||document.documentElement).appendChild(b);
           }
           if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true}); else install();
           setTimeout(install,500);
          })();
          </script>'''
          html=html.replace("</body>",inline+"\n</body>") if "</body>" in html else html+inline
          files["index.html"]=html.encode()
          files["VERSION.txt"]=b"1.20.20\n"
          js="(() => {\\nfunction build(){\\n const g=[...document.querySelectorAll('svg')].sort((a,b)=>b.getBoundingClientRect().width*b.getBoundingClientRect().height-a.getBoundingClientRect().width*a.getBoundingClientRect().height)[0];\\n const graphic=g?g.outerHTML:'<div class=\"placeholder\">Ergebnisgrafik</div>';\\n const h=`<!doctype html><html><head><meta charset=\"utf-8\"><title>Engbers Ausgabedokument</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#333;font-family:Arial}.bar{position:fixed;right:20px;top:20px}.page{position:relative;width:210mm;height:297mm;margin:12px auto;background:#fff;padding:12mm}.head{display:flex;justify-content:space-between;font-size:9pt;font-weight:bold;border-bottom:1px solid #234;padding-bottom:3mm}.title{margin-top:4mm;padding:4mm;border:1px solid #456;background:#eef5f7;font-size:16pt;font-weight:bold}.meta,.kpis{display:grid}.meta{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(5,1fr)}.m,.k{border:1px solid #abc;border-top:0;padding:3mm}.m{min-height:17mm;font-size:8pt}.m b{display:block;font-size:10pt;margin-top:2mm}.k{min-height:38mm;font-size:9pt}.k strong{display:block;font-size:18pt;margin-top:2mm}.sec{margin-top:7mm;border-bottom:1px solid #234;padding-bottom:2mm;font-weight:bold}.graphic{height:120mm;margin-top:4mm;overflow:hidden}.graphic svg{width:100%;height:100%}.foot{position:absolute;left:12mm;right:12mm;bottom:9mm;border-top:1px solid #abc;padding-top:2mm;font-size:7pt;display:flex;justify-content:space-between}@media print{body{background:#fff}.bar{display:none}.page{margin:0}}</style></head><body><div class=\"bar\"><button onclick=\"window.print()\">Drucken / PDF</button></div><div class=\"page\"><div class=\"head\"><span>26-014 · Bussmann</span><span>ENGBERS INGENIEURBAU · GEOTECHNIK<br>EI_G_001 · TRÄGERBOHLWAND</span></div><div class=\"title\">POSITION &nbsp; POS. VB1 · Trägerbohlwand</div><div class=\"meta\"><div class=\"m\">BAUVORHABEN<b>Bussmann</b></div><div class=\"m\">BAUHERR<b>—</b></div><div class=\"m\">BERECHNUNG<b>Geotechnik · Trägerbohlwand</b></div><div class=\"m\">PROJEKTNUMMER<b>26-014</b></div><div class=\"m\">BEARBEITER<b>—</b></div><div class=\"m\">POSITION<b>VB1</b></div></div><div class=\"kpis\"><div class=\"k\">AUSHUB<strong>4,00 m</strong></div><div class=\"k\">Σ E<sub>h,k</sub><strong>61,2 kN/m</strong></div><div class=\"k\">SOHLORDINATE<strong>26,3 kN/m²</strong></div><div class=\"k\">BOHLTRÄGER<strong>HEB 360</strong>S235 · A = 1,50 m</div><div class=\"k\">RECHENMODELL<strong>Aktiver Erddruck</strong>BLUM · UNVERANKERT</div></div><div class=\"sec\">GEOTECHNISCHE ERGEBNISGRAFIK</div><div class=\"graphic\">${graphic}</div><div class=\"foot\"><span>Engbers Ingenieurbau · Geotechnik</span><span>EI_G_001 · Trägerbohlwand</span></div></div></body></html>`;\\n const win=window.open('','_blank');win.document.open();win.document.write(h);win.document.close();\\n}\\nfunction install(){if(document.getElementById('engbers-output-document-btn'))return;const b=document.createElement('button');b.id='engbers-output-document-btn';b.textContent='Engbers-Ausgabedokument';b.style.cssText='position:fixed;right:18px;top:78px;z-index:2147483647;padding:9px 13px;background:#fff;border:2px solid #087f73;border-radius:6px;font-weight:700';b.onclick=build;(document.body||document.documentElement).appendChild(b)};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',install,{once:true})}else{install()}\\n})();"

          files["js/output_test.js"]=js.encode("utf-8")
          # updater cache fix: append a unique query to manifest fetches in app.js
          if "js/app.js" in files:
              app=files["js/app.js"].decode("utf-8")
              app=app.replace("statiktools/stable/manifest.json","statiktools/stable/manifest.json?nocache=12020")
              files["js/app.js"]=app.encode("utf-8")
          out=io.BytesIO()
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as q:
              for n,b in files.items(): q.writestr(n,b)
          raw=out.getvalue(); sha=hashlib.sha256(raw).hexdigest()
          pkg={"format":"base64-json","version":"1.20.20","sha256":sha,"data_base64":base64.b64encode(raw).decode()}
          (root/"package_1_20_20.json").write_text(json.dumps(pkg,separators=(",",":")),encoding="utf-8")
          manifest={
            "version":"1.20.20","update_available":True,
            "notes":"1.20.20: Ausgabedokument direkt in index.html integriert; keine externe Testscript-Abhängigkeit. Rechenkern unverändert.",
            "package_url":"https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/statiktools/stable/package_1_20_20.json?v=202610071231",
            "package_format":"base64-json","sha256":sha}
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
      - name: Commit update
        run: |
          git config user.name "Engbers Update Builder"
          git config user.email "actions@users.noreply.github.com"
          git add statiktools/stable/package_1_20_20.json statiktools/stable/manifest.json
          git commit -m "Statiktools 1.20.20 output test" || exit 0
          git push
