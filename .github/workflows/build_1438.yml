name: Build Engbers Projektzentrale 1.4.38
on:
  push:
    paths:
      - 'build/1438/BUILD'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate update
        run: |
          python -m py_compile build/1438/patch_1438.py
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('build/1438/patch_1438.py')
          spec=importlib.util.spec_from_file_location('p1438',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''APP_VERSION = "1.4.37"\nclass Demo:\n    def search(self):\n        top=tk.Toplevel(self)\n        top.title("Suchergebnisse")\n        result_tree=ttk.Treeview(top,columns=("bereich","treffer"),show="headings")\n        result_tree.pack()\n        result_tree.bind("<Double-1>",lambda e: None)\n    def render_statik(self):\n        ptr=ttk.Treeview(self,columns=("gruppe","mb_projekt","pos","bezeichnung","modul","kennwert"),show="headings")\n        try:\n            _cols=list(ptr.cget('columns'))\n            _cols.insert(3,'pz_bearbeitung')\n            ptr.configure(columns=tuple(_cols))\n            ptr.heading('pz_bearbeitung',text='Status')\n            ptr.column('pz_bearbeitung',width=100,minwidth=88,stretch=False,anchor='w')\n        except Exception:\n            pass\n'''
          a,ok1=m._patch_search_navigation(src)
          assert ok1 and 'PZ_SEARCH_NAV_V1438' in a
          assert "after_idle(_pz_1438_bind_project_open)" in a
          assert "identify_row(_evt.y)" in a
          b,ok2=m._patch_position_layout(a)
          assert ok2 and 'PZ_POSITION_LAYOUT_V1438' in b
          assert "'bezeichnung':(285,180,True)" in b
          assert "ptr.xview_moveto(0)" in b
          compile(b,'synthetic_1438.py','exec')
          print('synthetic 1.4.38 test OK')
          PY
          python - <<'PY'
          import pathlib, zipfile, hashlib, base64, json
          root=pathlib.Path('.')
          patch=root/'build/1438/patch_1438.py'
          starter=root/'build/1438/START_PROJEKTZENTRALE.cmd'
          zip_path=root/'stable/Engbers_Projektzentrale_UPDATE_1_4_38_TINY.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(patch,'patch_1438.py')
              z.write(starter,'START_PROJEKTZENTRALE.cmd')
          data=zip_path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          package={'version':'1.4.38','filename':zip_path.name,'sha256':sha,'payload_b64':base64.b64encode(data).decode('ascii')}
          (root/'stable/update_1_4_38_tiny.json').write_text(json.dumps(package,separators=(',',':')),encoding='utf-8')
          manifest={
              'app':'Engbers Projektzentrale','channel':'stable','version':'1.4.38','published_at':'2026-09-16',
              'min_bootstrap_version':'1.4.35','package_url':'https://raw.githubusercontent.com/Norbert1206/engbers-projektzentrale-updates/main/stable/update_1_4_38_tiny.json',
              'package_format':'base64-json','sha256':sha,
              'notes':'Version 1.4.38: Die globale Projektsuche bindet den Doppelklick erst nach vollständigem Aufbau des Suchfensters und wählt das Zielprojekt anhand der Projektnummer robust im Projektwähler. Gleichzeitig wird die Positionsliste kompakter aufgebaut, sodass Position, Status, Bezeichnung, mb-Modul und Kennwert ohne notwendiges horizontales Scrollen sichtbar bleiben.',
              'update_available':True,
          }
          (root/'stable/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          chk=json.loads((root/'stable/update_1_4_38_tiny.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(chk['payload_b64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()==sha
          print(sha)
          PY
      - name: Commit release files
        run: |
          git config user.name 'engbers-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add stable/Engbers_Projektzentrale_UPDATE_1_4_38_TINY.zip stable/update_1_4_38_tiny.json stable/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release Projektzentrale 1.4.38'
          git pull --rebase origin main
          git push origin main
